<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quoridor Online - Premium Board Game</title>
  <meta name="description"
    content="Beautifully designed Quoridor board game in your browser. Challenge a friend in this tactical masterpiece.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="game-container">
    <div class="status-panel">
      <div id="player1-info" class="player-info player1 active">
        <span class="player-name">PLAYER 1</span>
        <span id="p1-walls" class="walls-count">Walls: 10</span>
      </div>
      <div id="game-title" style="text-align: center;">
        <h1 style="font-size: 1.5rem; letter-spacing: 2px; color: #94a3b8;">QUORIDOR</h1>
        <div id="turn-indicator" style="font-size: 0.8rem; color: #64748b;">YOUR TURN</div>
      </div>
      <div id="player2-info" class="player-info player2">
        <span class="player-name">PLAYER 2</span>
        <span id="p2-walls" class="walls-count">Walls: 10</span>
      </div>
    </div>

    <div id="board">
      <!-- Grid will be generated by JavaScript -->
    </div>

    <div id="controls" style="margin-top: 20px;">
      <button id="btn-undo" class="btn-undo">UNDO</button>
    </div>

    <div style="margin-top: 10px; color: #64748b; font-size: 0.8rem;">
      Click cells to move. Click gaps to place walls.
    </div>
  </div>

  <div id="winner-overlay">
    <h1 id="winner-text">PLAYER 1 WINS!</h1>
    <button class="btn-restart" onclick="location.reload()">PLAY AGAIN</button>
  </div>

  <script type="module" src="view.js"></script>
</body>

</html>
